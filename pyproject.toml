[project]
name = "sl-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "aiortc>=1.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "realtimetts[omnivoice]>=0.7.1",
    "python-dotenv>=1.2.1",
    "psycopg[binary]>=3.2",
    "torchaudio>=2.9.0,<3",
    "torch>=2.9.0,<3",
    "transformers>=5.3.0,<6",
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.0",
    "pinecone>=9.1.0",
    "num2words>=0.5.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
[tool.uv]
# OmniVoice declares UI/training packages that its inference path never imports.
override-dependencies = [
    "gradio; python_version < '0'",
    "librosa; python_version < '0'",
    "tensorboardx; python_version < '0'",
    "webdataset; python_version < '0'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
