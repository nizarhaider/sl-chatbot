[project]
name = "sl-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "aiortc>=1.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "huggingface-hub>=0.36.0",
    "realtimetts[omnivoice]>=0.7.1",
    "python-dotenv>=1.2.1",
    "psycopg[binary]>=3.2",
    "omnivoice>=0.1.5",
    "torchaudio>=2.9.0,<3",
    "torch>=2.9.0,<3",
    "torchvision>=0.24.0,<0.27",
    "accelerate>=1.12.0",
    "transformers>=4.57.0",
    "pinecone>=9.1.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.1.0",
    "num2words>=0.5.14",
    "llama-cpp-python[server]>=0.3.35; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
transformers = { git = "https://github.com/huggingface/transformers.git" }

[tool.pytest.ini_options]
pythonpath = ["."]
