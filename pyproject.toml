[project]
name = "voice-agent"
version = "0.1.0"
description = "Gemini Live WhatsApp voice bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "aiortc>=1.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
    "psycopg[binary]>=3.2",
    "boto3>=1.42.0",
    "google-genai>=1.69.0",
    "psutil>=7.0.0",
    "pipecat-ai[google,webrtc]==1.14.0",
    "aiohttp>=3.11",
    "ruff>=0.17.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
