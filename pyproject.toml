[project]
name = "sl-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "aiortc>=1.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "huggingface-hub>=0.36.0",
    "llama-cpp-python>=0.3.16",
    "realtimetts[omnivoice]>=0.7.1",
    "python-dotenv>=1.2.1",
    "psycopg[binary]>=3.2",
    "omnivoice>=0.1.5",
    "torchaudio>=2.7.0,<2.8",
    "torch>=2.7.0,<2.8",
    "accelerate>=1.12.0",
    "transformers>=4.57.0"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cu125"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu125"
explicit = true

[tool.uv.sources]
llama-cpp-python = [
    { index = "llama-cpp-cu125", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
