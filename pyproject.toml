[project]
name = "sl-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "pydantic>=2.12.5",
    "aiortc>=1.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "websockets>=12.0",
    "google-genai>=1.66.0",
    "google-adk>=1.26.0",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.43.0",
    "openpyxl>=3.1.5",
    "ddgs>=9.11.2",
    "realtimestt>=0.3.104",
    "realtimetts>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
