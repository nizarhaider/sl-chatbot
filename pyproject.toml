[project]
name = "sl-chatbot"
version = "0.2.0"
description = "Lean local-model runtime for SerendibAI WhatsApp voice calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.14,<2",
    "fastapi>=0.129,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
server = [
    "accelerate>=1.12,<2",
    "huggingface-hub>=0.36,<2",
    "llama-cpp-python>=0.3.16,<1",
    "omnivoice>=0.1.5",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "transformers>=5.3,<6",
]
infer = [
    "accelerate>=1.12,<2",
    "gradio>=6.5,<7",
    "huggingface-hub>=0.36,<2",
    "omnivoice>=0.1.5",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "transformers>=5.3,<6",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cu125"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu125"
explicit = true

[tool.uv.sources]
llama-cpp-python = [
    { index = "llama-cpp-cu125", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
