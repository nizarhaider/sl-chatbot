[project]
name = "sl-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "pydantic>=2.12.5",
    "aiortc>=1.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "google-genai>=1.66.0",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.43.0",
    "openpyxl>=3.1.5",
    "realtimetts[omnivoice]>=0.7.1",
    "python-dotenv>=1.2.1",
    "omnivoice>=0.1.5",
    "torchaudio>=2.5.1,<2.6",
    "torch>=2.5.1,<2.6",
    "openai"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
