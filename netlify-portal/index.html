<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SerendibAI Portal</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#162033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;min-width:320px}main{max-width:960px;margin:auto;padding:clamp(24px,7vw,56px) max(20px,env(safe-area-inset-right))}.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid #e5e9f1;border-radius:16px;padding:28px;box-shadow:0 12px 40px #15223a12}h1{font-size:clamp(26px,7vw,34px);margin:0 0 8px;line-height:1.1}p{color:#65738a;line-height:1.5}input,button{font:inherit;min-height:48px;width:100%;margin:8px 0;padding:12px;border-radius:10px}input{border:1px solid #d7deea}button{border:0;background:#136957;color:#fff;cursor:pointer;font-weight:650}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e9f1;border-radius:14px;padding:20px}.card p{margin:0 0 12px}.value{font-size:32px;font-weight:700}.tag{display:inline-block;padding:5px 8px;background:#e5f7f0;color:#136957;border-radius:999px;font-size:12px}nav{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:38px}nav button{width:auto;min-width:96px;margin:0}@media(max-width:700px){main{padding-top:max(28px,env(safe-area-inset-top))}.login{margin:8vh auto;padding:24px}.grid{grid-template-columns:1fr;gap:12px}.card{padding:18px}nav{align-items:flex-start;margin-bottom:28px}}@media(max-width:380px){main{padding-inline:16px}.login{padding:20px}nav{flex-direction:column}nav button{width:100%}}</style><main><section class="login" id="login"><h1>SerendibAI</h1><p>Client portal</p><input id="u" value="admin" autocomplete="username" aria-label="Username" placeholder="Username"><input id="p" type="password" value="admin" autocomplete="current-password" aria-label="Password" placeholder="Password"><button onclick="enter()">Sign in</button></section><section id="portal" hidden><nav><div><h1>SerendibAI</h1><span class="tag">Portal online</span></div><button onclick="location.reload()">Sign out</button></nav><div class="grid"><div class="card"><p>Calls</p><div class="value">—</div><p>Live metrics will appear when the WhatsApp bridge is connected.</p></div><div class="card"><p>Documents</p><div class="value">0</div><p>Upload and Pinecone indexing are being connected to the live backend.</p></div><div class="card"><p>Agents</p><div class="value">1</div><p>Agent configuration is ready for the next connected call.</p></div></div></section></main><script>function enter(){if(u.value==='admin'&&p.value==='admin'){login.hidden=true;portal.hidden=false}else alert('Invalid credentials')}</script></html>
