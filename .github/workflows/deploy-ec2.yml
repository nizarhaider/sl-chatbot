name: Deploy voice agent

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voice-agent-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.SERENDIBAI_EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          printf '%s\n' '13.207.194.210 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDbPz7iUsRQYlcb36RgLnK71FWyZ+IIioep7eq8clRwj' >> ~/.ssh/known_hosts

      - name: Sync code and restart
        run: |
          rsync -az --delete \
            --exclude=.env \
            --exclude=.venv \
            --exclude=.pytest_cache \
            --exclude=.git \
            --rsync-path='sudo rsync' \
            -e "ssh -i $HOME/.ssh/ec2_key -o BatchMode=yes -o ConnectTimeout=15" \
            ./ ubuntu@13.207.194.210:/opt/serendibai/voice-agent/
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o ConnectTimeout=15 ubuntu@13.207.194.210 'sudo systemctl restart voice-agent.service'
