name: prod test

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy-all-vast-instances:
    if: github.event_name == 'schedule'
    name: Destroy all Vast instances
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Destroy every active instance
        env:
          VAST_AI_API_KEY: ${{ secrets.VAST_AI_API_KEY }}
        run: |
          test -n "$VAST_AI_API_KEY"
          instances=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw show instances)
          ids=$(printf '%s' "$instances" | jq -r '.[].id')
          if test -z "$ids"; then
            echo "No Vast instances are active."
            exit 0
          fi
          failed=0
          for id in $ids; do
            echo "Destroying Vast instance $id"
            uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
              destroy instance "$id" -y || failed=1
          done
          exit "$failed"

  gpu-integration:
    if: github.event_name != 'schedule'
    name: GPU integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VAST_AI_API_KEY: ${{ secrets.VAST_AI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTORCH_IMAGE: pytorch/pytorch:2.11.0-cuda12.8-cudnn9-devel
      SSH: ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Validate production contracts
        run: |
          test -n "$VAST_AI_API_KEY"
          test -n "$HF_TOKEN"
          test -n "$GEMINI_API_KEY"
          bash -n scripts/vast.sh
          grep -F 'SETUP_LIMIT_SECONDS="${SETUP_LIMIT_SECONDS:-900}"' scripts/vast.sh
          grep -F 'uv sync --extra server --frozen --no-build --no-install-project' scripts/vast.sh
          grep -F 'snapshot_download(repo_id=ASR_MODEL, revision=ASR_REVISION)' scripts/vast.sh
          grep -F 'ngrok http $APP_PORT --pooling-enabled' scripts/vast.sh
          grep -F 'uvicorn app.main:app --host 0.0.0.0 --port $APP_PORT --no-access-log' scripts/vast.sh
          setup_body=$(sed -n '/^setup() {/,/^deploy() {/p' scripts/vast.sh)
          ! grep -qE 'apt-get|uv sync|snapshot_download|hf_hub_download' <<<"$setup_body"

      - name: Provision GPU
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/vast-ci"
          public_key=$(cat "$RUNNER_TEMP/vast-ci.pub")
          uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
            create ssh-key "$public_key" -y
          marker=$(cut -d' ' -f2 "$RUNNER_TEMP/vast-ci.pub")
          keys=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw show ssh-keys)
          key_id=$(printf '%s' "$keys" | jq -r --arg marker "$marker" \
            '.[] | select(.public_key | contains($marker)) | .id' | tail -n 1)
          test "$key_id" != null
          echo "VAST_SSH_KEY_ID=$key_id" >> "$GITHUB_ENV"
          query='num_gpus=1 gpu_ram>=32 cpu_arch=amd64 disk_space>=80 cuda_vers>=12.8 direct_port_count>=1 reliability>=0.98 verified=true'
          offers=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
            search offers "$query" --storage 80 --order dph --limit 200)
          offer_ids=$(printf '%s' "$offers" | jq -r \
            '[.[] | select(
              (.gpu_name | test("^RTX 5090$"; "i")) and
              .inet_down >= 500 and .disk_bw >= 1500 and .reliability >= 0.998
            )] | sort_by(.dph_total) | .[:3] | .[].id')
          test -n "$offer_ids"
          attempt_number=0
          for offer_id in $offer_ids; do
            attempt_number=$((attempt_number + 1))
            label="serendibai-ci-${GITHUB_RUN_ID}-${attempt_number}"
            if ! result=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
              create instance "$offer_id" --image "$PYTORCH_IMAGE" \
              --disk 80 --label "$label" --ssh --direct --cancel-unavail); then
              existing=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw show instances)
              orphan_id=$(printf '%s' "$existing" | jq -r --arg label "$label" \
                '.[] | select(.label==$label) | .id' | tail -n 1)
              if test -n "$orphan_id"; then
                uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
                  destroy instance "$orphan_id" -y || true
              fi
              continue
            fi
            instance_id=$(printf '%s' "$result" | jq -r '.new_contract // empty')
            test -n "$instance_id" || continue
            echo "VAST_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
            chmod 600 "$RUNNER_TEMP/vast-ci"
            for attempt in $(seq 1 180); do
              state=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
                show instance "$instance_id")
              row=$(printf '%s' "$state" | jq 'if type=="array" then .[0] else . end')
              message=$(printf '%s' "$row" | jq -r '.status_msg // empty')
              if printf '%s' "$message" | grep -qiE 'error|failed'; then
                break
              fi
              host=$(printf '%s' "$row" | jq -r '.public_ipaddr // empty')
              port=$(printf '%s' "$row" | jq -r '.ports["22/tcp"][0].HostPort // empty')
              if test -n "$host" && test -n "$port" && ssh -o BatchMode=yes \
                -o ConnectTimeout=8 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                -o StrictHostKeyChecking=accept-new \
                -i "$RUNNER_TEMP/vast-ci" -p "$port" "root@$host" true 2>/dev/null; then
                echo "VAST_HOST=$host" >> "$GITHUB_ENV"
                echo "VAST_PORT=$port" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 5
            done
            uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
              destroy instance "$instance_id" -y || true
            echo 'VAST_INSTANCE_ID=' >> "$GITHUB_ENV"
          done
          exit 1

      - name: Prepare the GPU workspace
        run: |
          remote="root@$VAST_HOST"
          git archive --format=tar.gz -o "$RUNNER_TEMP/sl-chatbot.tar.gz" HEAD
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new \
            -i "$RUNNER_TEMP/vast-ci" -p "$VAST_PORT" "$remote" \
            'rm -rf /workspace/sl-chatbot && mkdir -p /workspace/sl-chatbot'
          for attempt in 1 2 3; do
            if scp -q -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new \
              -i "$RUNNER_TEMP/vast-ci" -P "$VAST_PORT" \
              "$RUNNER_TEMP/sl-chatbot.tar.gz" "$remote:/workspace/"; then
              break
            fi
            test "$attempt" -lt 3
            sleep 10
          done
          install -m 600 /dev/null "$RUNNER_TEMP/hf.env"
          printf 'HF_TOKEN=%s\n' "$HF_TOKEN" > "$RUNNER_TEMP/hf.env"
          scp -q -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" \
            -P "$VAST_PORT" "$RUNNER_TEMP/hf.env" "$remote:/workspace/sl-chatbot/.env"
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=accept-new \
            -i "$RUNNER_TEMP/vast-ci" -p "$VAST_PORT" "$remote" 'bash -se' <<'REMOTE'
          tar -xzf /workspace/sl-chatbot.tar.gz -C /workspace/sl-chatbot
          cd /workspace/sl-chatbot
          sync_ok=false
          for attempt in 1 2 3; do
            if timeout 15m uv sync --extra server --frozen; then
              sync_ok=true
              break
            fi
            echo "uv sync attempt $attempt failed; retrying" >&2
            sleep 15
          done
          test "$sync_ok" = true
          find .venv/lib/python3.11/site-packages/nvidia -type d -name lib \
            -print | paste -sd: - > .cuda-library-path
          printf "%s\n" \
            "#!/usr/bin/env bash" \
            "set -euo pipefail" \
            "cd /workspace/sl-chatbot" \
            "export LD_LIBRARY_PATH=\"\$(cat .cuda-library-path):\${LD_LIBRARY_PATH:-}\"" \
            "PYTHONPATH=. .venv/bin/dotenv -f .env run -- .venv/bin/python tests/gpu_integration.py \"\$1\"" \
            > run-stage
          chmod +x run-stage
          REMOTE

      - name: Run production tests
        run: |
          $SSH -i "$RUNNER_TEMP/vast-ci" -p "$VAST_PORT" "root@$VAST_HOST" /workspace/sl-chatbot/run-stage webhook
          $SSH -i "$RUNNER_TEMP/vast-ci" -p "$VAST_PORT" "root@$VAST_HOST" /workspace/sl-chatbot/run-stage asr
          $SSH -i "$RUNNER_TEMP/vast-ci" -p "$VAST_PORT" "root@$VAST_HOST" /workspace/sl-chatbot/run-stage llm
          scp -q -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" \
            -P "$VAST_PORT" "root@$VAST_HOST:/workspace/sl-chatbot/gpu-integration-report.json" .
          judge_status=0
          GEMINI_API_KEY="$GEMINI_API_KEY" uv run --frozen python tests/gpu_integration.py judge || judge_status=$?
          scp -q -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" \
            -P "$VAST_PORT" gpu-integration-report.json \
            "root@$VAST_HOST:/workspace/sl-chatbot/gpu-integration-report.json"
          test "$judge_status" -eq 0

      - name: Collect stage report and audible samples
        if: always()
        run: |
          if test -n "${VAST_HOST:-}" && test -n "${VAST_PORT:-}"; then
            scp -q -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" \
              -P "$VAST_PORT" "root@$VAST_HOST:/workspace/sl-chatbot/gpu-integration-report.json" . || true
            scp -qr -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" \
              -P "$VAST_PORT" "root@$VAST_HOST:/workspace/sl-chatbot/gpu-integration-audio" . || true
          fi

      - name: Upload integration report and audible samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-integration-${{ github.run_id }}
          path: |
            gpu-integration-report.json
            gpu-integration-audio/
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy GPU and remove SSH key
        if: always()
        run: |
          if test -n "${VAST_INSTANCE_ID:-}"; then
            uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
              destroy instance "$VAST_INSTANCE_ID" -y
          fi
          if test -n "${VAST_SSH_KEY_ID:-}"; then
            uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
              delete ssh-key "$VAST_SSH_KEY_ID"
          fi
