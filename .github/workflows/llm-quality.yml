name: LLM conversation quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAST_AI_API_KEY: ${{ secrets.VAST_AI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VAST_TEMPLATE_HASH: 18e97fc6703dea11057cee364a8eaa8c

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Provision temporary LLM GPU
        run: |
          set -euo pipefail
          test -n "$VAST_AI_API_KEY"
          test -n "$HF_TOKEN"
          test -n "$GEMINI_API_KEY"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/vast-ci"
          public_key=$(cat "$RUNNER_TEMP/vast-ci.pub")
          uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw create ssh-key "$public_key" -y
          query='num_gpus=1 gpu_ram>=32 cpu_arch=amd64 disk_space>=80 cuda_vers>=12.8 direct_port_count>=1 reliability>=0.98 verified=true'
          offers=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw search offers "$query" --storage 80 --order dph --limit 100)
          offer_id=$(printf '%s' "$offers" | jq -r '[.[] | select(.gpu_name | test("^RTX (30|40|50)"; "i"))] | sort_by(.dph_total) | .[0].id')
          test -n "$offer_id" && test "$offer_id" != null
          label="serendibai-llm-quality-${GITHUB_RUN_ID}"
          created=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
            create instance "$offer_id" --template_hash "$VAST_TEMPLATE_HASH" --disk 80 \
            --label "$label" --ssh --direct --cancel-unavail)
          instance_id=$(printf '%s' "$created" | jq -r '.new_contract')
          test -n "$instance_id" && test "$instance_id" != null
          echo "VAST_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
          chmod 600 "$RUNNER_TEMP/vast-ci"
          for attempt in $(seq 1 60); do
            row=$(uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw show instance "$instance_id" | jq 'if type=="array" then .[0] else . end')
            host=$(printf '%s' "$row" | jq -r '.public_ipaddr // empty')
            port=$(printf '%s' "$row" | jq -r '.ports["22/tcp"][0].HostPort // empty')
            if test -n "$host" && test -n "$port" && ssh -o BatchMode=yes -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" -p "$port" "root@$host" true 2>/dev/null; then
              echo "VAST_HOST=$host" >> "$GITHUB_ENV"
              echo "VAST_PORT=$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run Gemma-only conversation stages
        run: |
          set -euo pipefail
          remote="root@$VAST_HOST"
          tar -czf "$RUNNER_TEMP/sl-chatbot.tar.gz" \
            --exclude='.git' --exclude='.venv' --exclude='run_logs' .
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" \
            -p "$VAST_PORT" "$remote" 'rm -rf /workspace/sl-chatbot && mkdir -p /workspace/sl-chatbot'
          scp -q -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" -P "$VAST_PORT" \
            "$RUNNER_TEMP/sl-chatbot.tar.gz" "$remote:/workspace/"
          printf 'HF_TOKEN=%s\n' "$HF_TOKEN" > "$RUNNER_TEMP/llm.env"
          scp -q -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" -P "$VAST_PORT" \
            "$RUNNER_TEMP/llm.env" "$remote:/workspace/sl-chatbot/.env"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" \
            -p "$VAST_PORT" "$remote" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /workspace/sl-chatbot
          tar -xzf /workspace/sl-chatbot.tar.gz
          uv sync --frozen
          .venv/bin/python tests/llm_quality.py --evidence-only --report llm-quality-evidence.json
          REMOTE
          scp -q -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vast-ci" -P "$VAST_PORT" \
            "$remote:/workspace/sl-chatbot/llm-quality-evidence.json" .

      - name: Judge every conversation stage
        run: |
          set -euo pipefail
          uv run --no-project --with httpx python tests/llm_quality.py \
            --evidence llm-quality-evidence.json --report llm-quality-report.json

      - name: Upload graded report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llm-quality-report
          path: |
            llm-quality-evidence.json
            llm-quality-report.json
          if-no-files-found: ignore

      - name: Destroy temporary GPU
        if: always() && env.VAST_INSTANCE_ID != ''
        run: |
          uvx --from vastai vastai --api-key "$VAST_AI_API_KEY" --raw \
            destroy instance "$VAST_INSTANCE_ID" -y || true
