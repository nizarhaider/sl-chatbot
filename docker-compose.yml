services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - whatsapp-webhook

  whatsapp-webhook:
    build: .
    container_name: whatsapp_webhook_server
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always

volumes:
  caddy_data:
  caddy_config:
